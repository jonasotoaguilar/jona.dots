onboarding = false

[theme]
name = "catppuccin"

auto_switch = false
[theme.custom]
panel_bg = "#06080f"
accent = "#6FA0AF"
green = "#B7CC85"
blue = "#6FA0AF"
red = "#CB7C94"
yellow = "#DEBA87"

[terminal]
new_cwd = "follow"

[ui]
accent = "#6FA0AF"
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"
hide_tab_bar_when_single_tab = true

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent", "state_text"]]

[ui.toast]
delivery = "system"

[keys]
prefix = "ctrl+a"
# Agentes: solo prefix + tecla (sin alt/ctrl combinados)
previous_agent = "prefix+up"
next_agent = "prefix+down"
focus_agent = "prefix+shift+1..9"
new_workspace = "prefix+n"
next_tab = "prefix+right" # era prefix+period; flechas para tabs
previous_tab = "prefix+left"
goto = "prefix+shift+f" # era prefix+f; f pasa a file picker
toggle_sidebar = "prefix+d" # d estaba libre; b pasa a nvim popup

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "herdr-lazygit.open"
description = "lazygit sidebar (open/focus/toggle)"

[[keys.command]]
key = "prefix+e"
type = "popup"
command = "nvim"
description = "nvim popup"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "scratch terminal"
width = "80%"
height = "80%"

# Plugins nuevos (jul 2026)
[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "herdr-sidebar.open-sidebar"
description = "sidebar: explorer + source control (toggle)"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr.file-picker.pick"
description = "file picker (directorio del pane)"

[[keys.command]]
key = "prefix+ctrl+f"
type = "plugin_action"
command = "herdr.file-picker.pick-git-root"
description = "file picker (git root)"

[[keys.command]]
key = "prefix+shift+w"
type = "plugin_action"
command = "zenbu-labs.terminal-browser.open-split"
description = "terminal-browser en split derecho"

[[keys.command]]
key = "prefix+w"
type = "popup"
command = "/home/jona/.config/herdr/plugins/github/fullerzz.sesh-ac3fc6b2e1d3/bin/herdr-sesh picker"
description = "sesh: workspace picker (popup)"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+b"
type = "popup"
command = "/home/jona/.config/herdr/plugins/github/dave.token-dashboard-c1bf535be307/bin/token-dashboard"
description = "token dashboard (popup)"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+b"
type = "shell"
command = '"${HERDR_BIN_PATH}" plugin pane open --plugin official.browser --entrypoint browser --placement overlay --focus'
description = "open browser overlay"

[ui.sound]
enabled = true

[experimental]
kitty_graphics = true
