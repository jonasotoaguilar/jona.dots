openapi: "3.0.3"
info:
  title: "{API Name}"
  description: "{Description of the API}"
  version: "1.0.0"
  contact:
    name: "{Team Name}"
    email: "{email}"

servers:
  - url: "https://api.example.com/v1"
    description: "Production"
  - url: "https://staging-api.example.com/v1"
    description: "Staging"

security:
  - bearerAuth: []

paths:
  /resource:
    get:
      summary: "List resources"
      description: "Returns a paginated list of resources"
      operationId: "listResources"
      tags:
        - "Resources"
      parameters:
        - name: "limit"
          in: "query"
          description: "Max results per page"
          required: false
          schema:
            type: "integer"
            default: 20
        - name: "page"
          in: "query"
          description: "Page number"
          required: false
          schema:
            type: "integer"
            default: 1
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Resource"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

    post:
      summary: "Create a resource"
      description: "Creates a new resource"
      operationId: "createResource"
      tags:
        - "Resources"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceRequest"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /resource/{id}:
    get:
      summary: "Get a resource"
      description: "Returns a single resource by ID"
      operationId: "getResource"
      tags:
        - "Resources"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"

  schemas:
    Resource:
      type: "object"
      required:
        - "id"
        - "createdAt"
      properties:
        id:
          type: "string"
          description: "Unique resource identifier"
          example: "res_1234567890"
        createdAt:
          type: "string"
          format: "date-time"
          description: "ISO 8601 creation timestamp"

    CreateResourceRequest:
      type: "object"
      required:
        - "field"
      properties:
        field:
          type: "string"
          description: "Required field description"
          example: "value"

    Pagination:
      type: "object"
      properties:
        page:
          type: "integer"
        limit:
          type: "integer"
        total:
          type: "integer"
        totalPages:
          type: "integer"

    Error:
      type: "object"
      required:
        - "error"
      properties:
        error:
          type: "object"
          required:
            - "code"
            - "message"
          properties:
            code:
              type: "string"
              description: "Machine-readable error code"
            message:
              type: "string"
              description: "Human-readable error message"
            details:
              type: "object"
              description: "Optional error context"

  responses:
    ValidationError:
      description: "Invalid input"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "field is required"

    Unauthorized:
      description: "Missing or invalid authentication"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "UNAUTHORIZED"
              message: "Valid authentication required"

    NotFound:
      description: "Resource not found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "NOT_FOUND"
              message: "Resource not found"

    RateLimited:
      description: "Too many requests"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "RATE_LIMITED"
              message: "Too many requests, please retry later"
